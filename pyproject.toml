[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartwall"
version = "0.1.0"
description = "Traffic, continuity and billing for a radio group"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  # Starlette's test client still reaches for an anyio alias that anyio has
  # deprecated. Not ours to fix and not worth reading on every run.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# A test that a property refuses has to evaluate the property and nothing
# else. Assigning the result to a throwaway name to satisfy the linter makes
# the test read as if the value mattered.
"tests/*" = ["B018"]
# A migration is a table definition column by column. One column per line is
# how it is read and how it is diffed, and wrapping the long ones at a hundred
# characters makes it harder to see that a column is missing.
"migrations/*" = ["E501"]
# env.py registers every table by star import, which is the whole point of it.
"migrations/env.py" = ["E501", "F401", "F403"]
# Routes declare their query parameters and bodies as call defaults. That is
# the framework's calling convention and there is no way to write it otherwise.
"src/cartwall/api/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["cartwall"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

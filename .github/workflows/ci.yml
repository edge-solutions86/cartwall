name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: check on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: lint
        run: ruff check .

      - name: format
        run: ruff format --check .

      - name: types
        run: mypy src

      - name: tests
        run: pytest -q --maxfail=1

  migrations:
    name: migrations match the models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The suite already compares the migrated schema against the metadata.
      # This job runs that on its own so a schema drift is a named failure and
      # not one red cross among four hundred.
      - name: schema
        run: pytest -q tests/test_migrations.py

      - name: upgrade and downgrade a fresh database
        env:
          CARTWALL_DATABASE_URL: sqlite+pysqlite:///ci.sqlite3
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
